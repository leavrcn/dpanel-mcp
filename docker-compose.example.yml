# DPanel + dpanel-mcp 联合部署示例
# 版本对齐：dpanel/dpanel:1.11.0 ↔ dpanel-mcp 1.11.0
#
# 使用步骤：
#   1. 拷贝本文件为 docker-compose.yml 并替换所有 CHANGE_ME 占位符
#   2. docker compose up -d
#   3. 首次启动创建 DPanel founder 账号（免鉴权接口）：
#        curl -s http://127.0.0.1:8807/dpanel/api/common/user/create-founder \
#          -H 'Content-Type: application/json' \
#          -d '{"username":"admin","password":"你的强密码","confirmPassword":"你的强密码"}'
#   4. MCP 客户端接入 http://127.0.0.1:8090/mcp
#      请求头：Authorization: Bearer <DPANEL_MCP_AUTH_TOKEN 的值>
#
# 注意：
#   - 所有 CHANGE_ME 均为占位符，生产环境必须替换
#   - DP_JWT_SECRET 固定后 DPanel 重启不会使 MCP 会话失效
#   - dpanel-mcp 容器无需挂载 docker.sock，仅通过 HTTP 与 DPanel 通信

services:
  dpanel:
    image: dpanel/dpanel:1.11.0
    container_name: dpanel
    restart: unless-stopped
    ports:
      - "8807:8080"                        # DPanel Web UI / API
    environment:
      APP_NAME: dpanel
      DP_JWT_SECRET: "CHANGE_ME_FIXED_JWT_SECRET"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dpanel-data:/dpanel
    networks:
      - dpanel-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/dpanel/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dpanel-mcp:
    build:
      context: ./
      dockerfile: Dockerfile
    image: dpanel-mcp:1.11.0
    container_name: dpanel-mcp
    restart: unless-stopped
    depends_on:
      dpanel:
        condition: service_healthy
    ports:
      - "8090:8090"                        # MCP streamable-http 端点
    environment:
      DPANEL_HOST: http://dpanel:8080      # compose 内部服务名 + 容器内部端口
      DPANEL_USERNAME: admin
      DPANEL_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
      DPANEL_MCP_TRANSPORT: streamable-http
      DPANEL_MCP_HTTP_HOST: 0.0.0.0
      DPANEL_MCP_HTTP_PORT: "8090"
      DPANEL_MCP_HTTP_PATH: /mcp
      DPANEL_MCP_AUTH_TOKEN: "CHANGE_ME_LONG_RANDOM_TOKEN"
      DPANEL_MCP_PROFILE: read-write
    networks:
      - dpanel-net

networks:
  dpanel-net:

volumes:
  dpanel-data:
    driver: local

