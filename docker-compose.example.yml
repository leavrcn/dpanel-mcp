# DPanel + dpanel-mcp 联合部署示例
# 版本对齐：dpanel/dpanel:latest（当前稳定版 1.11.0）↔ dpanel-mcp 1.11.0
#
# ══════════════════════════════════════════════════════════════════════
# 部署步骤
# ══════════════════════════════════════════════════════════════════════
#
#   1. 拷贝本文件为 docker-compose.yml
#      ⚠️ 本文件必须放在 dpanel-mcp 仓库根目录下运行（dpanel-mcp 依赖本地 Dockerfile 构建）
#
#   2. 拷贝 .env.example 为 .env，填入实际值（.env 已在 .gitignore，不会入库）：
#        DP_JWT_SECRET=<固定随机字符串，如 openssl rand -hex 32>
#        DPANEL_ADMIN_PASSWORD=<DPanel 管理员密码>
#        DPANEL_MCP_AUTH_TOKEN=<MCP 端点认证 token，如 openssl rand -hex 32>
#
#   3. 按需修改下方「用户改动点」标注处（端口、存储路径、能力分级等）
#
#   4. docker compose up -d
#
#   5. 首次启动创建 DPanel founder 账号（免鉴权接口，仅可调用一次）：
#      如果你已打开 DPanel 页面并注册过账号，跳过此步骤，.env 填页面注册的密码即可。
#        curl -s http://127.0.0.1:8807/dpanel/api/common/user/create-founder \
#          -H 'Content-Type: application/json' \
#          -d '{"username":"admin","password":"<同 .env 中 DPANEL_ADMIN_PASSWORD>","confirmPassword":"<同 .env 中 DPANEL_ADMIN_PASSWORD>"}'
#
#   6. MCP 客户端接入 http://127.0.0.1:8090/mcp
#      请求头：Authorization: Bearer <.env 中 DPANEL_MCP_AUTH_TOKEN 的值>
#
# ══════════════════════════════════════════════════════════════════════
# 用户改动点速查（标注 ✅ 的地方需要按需修改）
# ══════════════════════════════════════════════════════════════════════
#
#   ✅ .env 三个变量              — 必改（步骤 2）
#   ✅ dpanel 端口 8807            — 若被占用改左侧宿主机端口，如 "127.0.0.1:18807:8080"
#   ✅ dpanel 存储路径 /opt/dpanel  — 改为你的宿主机路径
#   ✅ dpanel-mcp 端口 8090        — 若被占用改左侧宿主机端口，如 "127.0.0.1:18090:8090"
#   ✅ DPANEL_MCP_PROFILE          — 按需收窄为 read-only 或放宽为 admin
#   ✅ 端口对外                    — 默认仅 127.0.0.1，对外需改为 0.0.0.0
#
# ══════════════════════════════════════════════════════════════════════
# 注意事项
# ══════════════════════════════════════════════════════════════════════
#
#   - 敏感配置统一走 .env 文件，compose 文件本身可以安全入库
#   - DP_JWT_SECRET 固定后 DPanel 重启不会使 MCP 会话失效
#   - dpanel-mcp 容器无需挂载 docker.sock，仅通过 HTTP 与 DPanel 通信
#   - DPanel 镜像 tag：官方 latest 即当前稳定版（1.11.0），暂无独立版本 tag
#   - dpanel-mcp 镜像 tag 必须与 dpanel-mcp 发布版本对齐（当前 1.11.0）
#   - 已构建过镜像想跳过重编译：docker compose up -d --no-build
#   - 如需升级 dpanel-mcp：修改 image tag → docker compose up -d --build
#
# 镜像拉取方式：
#   - dpanel：默认从 Docker Hub 拉取（dpanel/dpanel:latest）
#     国内网络拉取慢/失败时，改用阿里云官方同步镜像（内容一致）：
#       image: registry.cn-hangzhou.aliyuncs.com/dpanel/dpanel:latest
#   - dpanel-mcp：未发布到 Docker Hub，只能本地构建（compose 会自动执行）
#     前提：本文件与 Dockerfile 在同一目录（即仓库根目录）
#     构建产物镜像名 dpanel-mcp:1.11.0，构建一次后可反复复用

services:
  dpanel:
    image: dpanel/dpanel:latest          # 官方 latest 即当前稳定版 1.11.0
                                         # ✅ 国内拉取慢/失败时改为阿里云镜像：
                                         #    registry.cn-hangzhou.aliyuncs.com/dpanel/dpanel:latest
    container_name: dpanel
    restart: unless-stopped
    ports:
      # ✅ 左侧为宿主机端口，若 8807 被占用可改为其他端口（如 18807）
      # ✅ 默认仅绑定 127.0.0.1（仅本机访问）；需对外改为 "0.0.0.0:8807:8080"
      - "127.0.0.1:8807:8080"
    environment:
      APP_NAME: dpanel
      # 从 .env 读取，请勿在此硬编码
      DP_JWT_SECRET: "${DP_JWT_SECRET:?请在 .env 中设置}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # ✅ 改为你的宿主机路径，DPanel 全部数据（数据库/compose 项目/网站文件）都在此目录下
      #    备份/迁移直接打包该目录即可；也可用相对路径 ./data/dpanel 跟随 compose 文件
      - /opt/dpanel:/dpanel
    networks:
      - dpanel-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/dpanel/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dpanel-mcp:
    # 本地构建：compose up 时自动执行（需 Dockerfile 在本目录）
    # 未发布到 Docker Hub，无法直接 pull；构建一次后镜像 dpanel-mcp:1.11.0 可复用
    build:
      context: ./
      dockerfile: Dockerfile
    image: dpanel-mcp:1.11.0             # ✅ 升级 dpanel-mcp 版本时修改此 tag
    container_name: dpanel-mcp
    restart: unless-stopped
    depends_on:
      dpanel:
        condition: service_healthy
    ports:
      # ✅ 左侧为宿主机端口，若 8090 被占用可改为其他端口（如 18090）
      # ✅ 默认仅绑定 127.0.0.1；MCP 客户端不在本机时改为 "0.0.0.0:8090:8090"
      - "127.0.0.1:8090:8090"
    environment:
      # compose 内部服务名 + 容器内部端口，无需修改
      DPANEL_HOST: http://dpanel:8080
      # DPanel 管理员账号（需与步骤 5 创建的 founder 账号一致）
      DPANEL_USERNAME: admin
      # 从 .env 读取，请勿在此硬编码
      DPANEL_PASSWORD: "${DPANEL_ADMIN_PASSWORD:?请在 .env 中设置}"
      DPANEL_MCP_TRANSPORT: streamable-http
      DPANEL_MCP_HTTP_HOST: 0.0.0.0
      DPANEL_MCP_HTTP_PORT: "8090"
      DPANEL_MCP_HTTP_PATH: /mcp
      # 从 .env 读取，MCP 客户端请求头携带此 token
      DPANEL_MCP_AUTH_TOKEN: "${DPANEL_MCP_AUTH_TOKEN:?请在 .env 中设置}"
      # ✅ 按需收窄或放宽：
      #    read-only  — 仅查询（列表、详情、日志），最安全
      #    read-write — 查询 + 启停/部署/创建（默认）
      #    admin      — 查询 + 写 + 删除/清理/恢复（需 confirm=true 确认）
      DPANEL_MCP_PROFILE: read-write
    networks:
      - dpanel-net

networks:
  dpanel-net:
