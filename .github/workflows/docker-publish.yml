name: docker-publish

# 推送 v* tag 或手动触发时，构建镜像并发布到 ghcr.io
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像 tag（留空则读取 pyproject.toml 的 version）'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本号
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          else
            V=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 安装 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/leavrcn/dpanel-mcp:${{ steps.ver.outputs.version }}
            ghcr.io/leavrcn/dpanel-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
